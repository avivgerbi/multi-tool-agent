<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Tool Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; color: #f1f5f9; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 760px;
      margin-bottom: 1.5rem;
    }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.4rem; }
    textarea, input[type=text] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 0.75rem;
      font-size: 0.95rem;
      resize: vertical;
    }
    textarea { min-height: 100px; }
    input[type=text] { height: 42px; }
    textarea:focus, input[type=text]:focus { outline: 2px solid #6366f1; border-color: transparent; }
    .row { display: flex; gap: 1rem; margin-top: 1rem; }
    button {
      padding: 0.65rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #submitBtn { background: #6366f1; color: #fff; flex: 1; }
    #clearBtn  { background: #334155; color: #e2e8f0; }
    #status { font-size: 0.85rem; color: #64748b; margin-top: 0.75rem; }
    .result-card { display: none; }
    .answer-box {
      background: #0f172a;
      border-left: 3px solid #6366f1;
      border-radius: 6px;
      padding: 1rem;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .meta { display: flex; gap: 1.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .meta span { font-size: 0.8rem; color: #64748b; }
    .meta span b { color: #94a3b8; }
    .trace-header {
      display: flex; align-items: center; gap: 0.5rem;
      cursor: pointer; user-select: none;
      margin-top: 1.25rem; margin-bottom: 0.5rem;
    }
    .trace-header h3 { font-size: 0.95rem; color: #94a3b8; font-weight: 600; }
    .toggle-btn {
      font-size: 0.75rem; padding: 0.2rem 0.6rem;
      background: #334155; color: #94a3b8;
      border-radius: 4px; border: none; cursor: pointer;
    }
    .trace-list { list-style: none; display: none; }
    .trace-list.open { display: block; }
    .trace-item {
      border-left: 2px solid #334155;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      border-radius: 0 6px 6px 0;
    }
    .trace-item.reasoning   { border-color: #6366f1; }
    .trace-item.tool_call   { border-color: #f59e0b; }
    .trace-item.tool_result { border-color: #10b981; }
    .trace-badge {
      display: inline-block;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
      padding: 0.15rem 0.5rem; border-radius: 999px; margin-bottom: 0.35rem;
    }
    .trace-item.reasoning   .trace-badge { background: #312e81; color: #a5b4fc; }
    .trace-item.tool_call   .trace-badge { background: #451a03; color: #fcd34d; }
    .trace-item.tool_result .trace-badge { background: #064e3b; color: #6ee7b7; }
    .trace-content { white-space: pre-wrap; color: #cbd5e1; line-height: 1.5; }
    .conv-id { font-size: 0.75rem; color: #475569; margin-top: 0.5rem; }
    .conv-id button {
      font-size: 0.72rem; padding: 0.15rem 0.5rem; margin-left: 0.4rem;
      background: #1e293b; color: #94a3b8; border: 1px solid #334155;
    }
    .error-box {
      background: #450a0a; border: 1px solid #b91c1c;
      border-radius: 8px; padding: 0.85rem; color: #fca5a5; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>🤖 Multi-Tool Agent</h1>
  <p class="subtitle">Powered by Claude · Reasoning step-by-step</p>

  <div class="card">
    <label for="task">Task</label>
    <textarea id="task" placeholder="e.g. What is 15% of 840? Or: What's the weather in Tokyo? Or: Search for the latest news about AI."></textarea>

    <label for="convId" style="margin-top:1rem">Conversation ID <span style="color:#475569">(optional — for follow-up questions)</span></label>
    <input type="text" id="convId" placeholder="Leave blank to start a new conversation" />

    <div class="row">
      <button id="submitBtn">Submit Task</button>
      <button id="clearBtn">Clear</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card result-card" id="resultCard">
    <div class="answer-box" id="answerBox"></div>

    <div class="meta">
      <span><b>Task ID:</b> <span id="metaTaskId"></span></span>
      <span><b>Latency:</b> <span id="metaLatency"></span>ms</span>
      <span><b>Tokens in/out:</b> <span id="metaTokens"></span></span>
    </div>

    <div class="trace-header" onclick="toggleTrace()">
      <h3>Reasoning Trace</h3>
      <button class="toggle-btn" id="toggleBtn">Show</button>
    </div>
    <ul class="trace-list" id="traceList"></ul>

    <div class="conv-id">
      Conversation ID: <span id="convIdDisplay"></span>
      <button onclick="useConvId()">Continue this conversation</button>
    </div>
  </div>

  <div class="card" id="errorCard" style="display:none">
    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    const submitBtn = document.getElementById('submitBtn');
    const taskInput  = document.getElementById('task');
    const convInput  = document.getElementById('convId');
    const statusEl   = document.getElementById('status');
    const resultCard = document.getElementById('resultCard');
    const errorCard  = document.getElementById('errorCard');
    let traceVisible = false;

    document.getElementById('clearBtn').addEventListener('click', () => {
      taskInput.value = '';
      convInput.value = '';
      resultCard.style.display = 'none';
      errorCard.style.display = 'none';
      statusEl.textContent = '';
    });

    submitBtn.addEventListener('click', submitTask);
    taskInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submitTask();
    });

    async function submitTask() {
      const task = taskInput.value.trim();
      if (!task) return;
      submitBtn.disabled = true;
      statusEl.textContent = 'Agent is thinking…';
      resultCard.style.display = 'none';
      errorCard.style.display = 'none';

      const body = { task };
      const conv = convInput.value.trim();
      if (conv) body.conversation_id = conv;

      try {
        const res = await fetch('/task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          let msg = res.statusText;
          try { const err = await res.json(); msg = err.detail || msg; } catch (_) {}
          throw new Error(msg);
        }
        const data = await res.json();
        renderResult(data);
        statusEl.textContent = '';
      } catch (e) {
        errorCard.style.display = 'block';
        document.getElementById('errorBox').textContent = 'Error: ' + e.message;
        statusEl.textContent = '';
      } finally {
        submitBtn.disabled = false;
      }
    }

    function renderResult(data) {
      document.getElementById('answerBox').textContent = data.answer;
      document.getElementById('metaTaskId').textContent = data.task_id.slice(0, 8) + '…';
      document.getElementById('metaLatency').textContent = Math.round(data.latency_ms);
      document.getElementById('metaTokens').textContent = `${data.input_tokens} / ${data.output_tokens}`;
      document.getElementById('convIdDisplay').textContent = data.conversation_id;

      const list = document.getElementById('traceList');
      list.innerHTML = '';
      list.classList.remove('open');
      traceVisible = false;
      document.getElementById('toggleBtn').textContent = 'Show';

      data.trace.forEach(step => {
        const li = document.createElement('li');
        li.className = `trace-item ${step.type}`;
        const label = step.type === 'tool_call'   ? '⚙ Tool Call'
                    : step.type === 'tool_result' ? '✓ Tool Result'
                    : '💭 Reasoning';
        let content = '';
        if (typeof step.content === 'string') {
          content = step.content;
        } else if (step.content && step.content.tool) {
          if (step.type === 'tool_call') {
            content = `Tool: ${step.content.tool}\nInput: ${JSON.stringify(step.content.input, null, 2)}`;
          } else {
            content = `Tool: ${step.content.tool}\nResult: ${step.content.result}`;
          }
        } else {
          content = JSON.stringify(step.content, null, 2);
        }
        li.innerHTML = `<span class="trace-badge">${label}</span><div class="trace-content">${escHtml(content)}</div>`;
        list.appendChild(li);
      });

      resultCard.style.display = 'block';
    }

    function toggleTrace() {
      traceVisible = !traceVisible;
      document.getElementById('traceList').classList.toggle('open', traceVisible);
      document.getElementById('toggleBtn').textContent = traceVisible ? 'Hide' : 'Show';
    }

    function useConvId() {
      convInput.value = document.getElementById('convIdDisplay').textContent;
      taskInput.focus();
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
